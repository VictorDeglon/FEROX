<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · FEROX</title>
<!-- The mascot, at the sizes browsers actually ask for. No SVG: the
     vector mark is the geometric wolf, not this one, and preferring it
     meant the tab showed a different animal from the rest of the app. -->
<link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16">
<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/brand/favicon-48.png" sizes="48x48">
<link rel="icon" href="assets/brand/icon.png" sizes="512x512">
<link rel="stylesheet" href="assets/css/ferox.css">
</head>
<body>
<main style="min-height:100dvh;display:grid;place-items:center;padding:32px;text-align:center">
  <div class="stack" style="gap:18px;justify-items:center;max-width:420px">
    <img class="mascot-art" src="assets/brand/mascot.webp" alt="" width="180" height="225" id="art">
    <h1 style="font-size:2.2rem">Page not found</h1>
    <p class="muted">That page doesn't exist. Here's the way back.</p>
    <div class="row" style="gap:10px">
      <a class="btn btn-primary" href="./">Home</a>
      <a class="btn" href="dashboard.html">Open the app</a>
    </div>
  </div>
</main>
<script type="module">
// Swap in the mascot if one has been added; the SVG mark is the fallback.
import { firstImage } from './assets/js/core/ui.js';
const src = await firstImage(['assets/brand/mascot.webp', 'assets/brand/mascot.png', 'assets/brand/mascot.jpg']);
// Width only — the height follows from the declared aspect ratio, so the
// wolf is never squashed into a square.
if (src) Object.assign(document.getElementById('art'), { src, width: 200, height: 250 });
</script>
</body>
</html>
