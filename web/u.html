<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athlete · FEROX</title>
<meta name="description" content="A FEROX athlete's public profile — streak, sessions and medals.">
<!-- A profile is somebody's page, not a search result we want indexed by
     default. They can share the link; a crawler should not find it for them. -->
<meta name="robots" content="noindex, nofollow">
<!-- The mascot, at the sizes browsers actually ask for. No SVG: the
     vector mark is the geometric wolf, not this one, and preferring it
     meant the tab showed a different animal from the rest of the app. -->
<link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16">
<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/brand/favicon-48.png" sizes="48x48">
<link rel="icon" href="assets/brand/icon.png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/css/ferox.css">
</head>
<body>
<main class="section">
  <div class="section-inner stack" style="gap:20px;max-width:620px">
    <a class="brand" href="dashboard.html" aria-label="FEROX"><span id="mark"></span></a>
    <div id="pane" class="stack" style="gap:18px">
      <div class="skel" style="height:140px"></div>
      <div class="skel" style="height:90px"></div>
    </div>
  </div>
</main>
<script type="module" src="assets/js/pages/u.js"></script>
</body>
</html>
