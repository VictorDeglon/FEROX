<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Workouts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="FEROX.png" alt="FEROX logo" class="logo">
    <h1 class="title">FEROX Admin</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="workouts.html">Workouts</a>
      <a href="progress.html">Progress</a>
      <a href="badges.html">Badges</a>
      <a href="admin.html" class="active">Admin</a>
    </nav>
  </header>
  <main class="container">
    <h2>Add Workout</h2>
    <form id="workoutForm">
      <label>Name<input type="text" name="name" required></label>
      <label>Description<input type="text" name="description"></label>
      <label>Long Description<textarea name="longDescription"></textarea></label>
      <label>Duration (min)<input type="number" name="duration"></label>
      <label>Difficulty<input type="text" name="difficulty"></label>
      <label>Calories<input type="number" name="calories"></label>
      <label>Type<input type="text" name="type"></label>
      <button type="submit">Save</button>
    </form>
    <p id="status"></p>
  </main>
  <script>
    document.getElementById('workoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form));
      const res = await fetch('/api/workouts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      document.getElementById('status').textContent = res.ok ? 'Saved!' : 'Error saving';
      if (res.ok) form.reset();
    });
  </script>
</body>
</html>
