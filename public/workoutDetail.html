<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Detail - FEROX</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-+nG7qAB58+Vz5zsxFrqOeCzvY4xXHzkwmo7aX6ixkmKsgNHYsYAGP82LPgAvFp8ZUBKbjsggq09NdXBJgkzHBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <header>
    <img src="FEROX.png" alt="FEROX logo" class="logo">
    <h1 class="title">Workout Details</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="workouts.html" class="active">Workouts</a>
      <a href="progress.html">Progress</a>
      <a href="badges.html">Badges</a>
      <a href="profile.html">Profile</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>
  <main class="container" id="details"></main>
  <script>
    async function load() {
      const id = new URLSearchParams(window.location.search).get('id');
      const res = await fetch(`/api/workouts/${id}`);
      if(!res.ok) { document.getElementById('details').textContent = 'Not found'; return; }
      const w = await res.json();
      document.getElementById('details').innerHTML = `
        <h2>${w.name}</h2>
        <p><strong>Type:</strong> ${w.type || ''}</p>
        <p><strong>Duration:</strong> ${w.duration || ''} min</p>
        <p><strong>Difficulty:</strong> ${w.difficulty || ''}</p>
        <p><strong>Calories:</strong> ${w.calories || ''}</p>
        <p>${w.longDescription || w.description || ''}</p>
      `;
    }
    load();
  </script>
</body>
</html>
